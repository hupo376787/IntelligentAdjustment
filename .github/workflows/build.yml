name: build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Pin .NET 8 for CI only
        shell: pwsh
        run: |
          $version = dotnet --list-sdks |
            ForEach-Object { ($_ -split ' ')[0] } |
            Where-Object { $_ -like '8.*' } |
            Sort-Object { [version]$_ } -Descending |
            Select-Object -First 1
          if (-not $version) { throw ".NET 8 SDK was not installed by setup-dotnet." }
          @{
            sdk = @{
              version = $version
              rollForward = "latestPatch"
              allowPrerelease = $false
            }
          } | ConvertTo-Json -Depth 3 | Set-Content -Encoding utf8 global.json
          dotnet --version

      - name: Restore
        run: dotnet restore IntelligentAdjustment.sln

      - name: Build
        run: dotnet build IntelligentAdjustment.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/IntelligentAdjustment.GoldenTests/IntelligentAdjustment.GoldenTests.csproj --configuration Release --no-build
